<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluffy Bunny</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --text: #2b2a28;
      --muted: #6b6760;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b19;
        --card: #2a2926;
        --text: #f1eee8;
        --muted: #a9a49b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    figure {
      margin: 0;
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      padding: 20px 24px 24px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <figure>
    <img src="images.jpg" alt="A fluffy white and tan angora bunny sitting among green leaves">
    <figcaption>
      <h1>Fluffy Bunny</h1>
      <p>A very fluffy angora rabbit, sitting pretty in the garden.</p>
    </figcaption>
  </figure>
</body>
</html>
